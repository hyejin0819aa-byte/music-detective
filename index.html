<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 노래 탐정소 🕵️‍♂️🎶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-4 sm:p-6">

    <!-- Header -->
    <header class="w-full max-w-2xl bg-white rounded-3xl p-6 shadow-xl border border-slate-200 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-amber-500 flex items-center gap-2">
                🕵️‍♂️ AI 노래 탐정소
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">가사, 흥얼거림, 들었던 장소로 기억 안 나는 노래를 찾아줄게!</p>
        </div>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-2xl bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-6">
        
        <!-- Input 1: Lyrics / Humming -->
        <div>
            <label class="block font-bold text-sm text-slate-700 mb-2">
                🎵 생각나는 가사나 음절 (허밍 소리)
            </label>
            <input type="text" id="input-clue" placeholder="예: 단단단 짠짠짠, 아기상어 바닷속, 뚜두뚜두" 
                   class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm">
        </div>

        <!-- Input 2: Place / Situation -->
        <div>
            <label class="block font-bold text-sm text-slate-700 mb-2">
                📍 들었던 장소나 상황
            </label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                <button type="button" onclick="selectPlace('유튜브 숏폼/릴스')" class="place-btn p-3 rounded-xl border border-slate-200 bg-slate-50 font-semibold hover:bg-amber-100 hover:border-amber-300 transition">📱 숏폼 / 릴스</button>
                <button type="button" onclick="selectPlace('TV 광고(CF)')" class="place-btn p-3 rounded-xl border border-slate-200 bg-slate-50 font-semibold hover:bg-amber-100 hover:border-amber-300 transition">📺 TV 광고</button>
                <button type="button" onclick="selectPlace('게임 BGM')" class="place-btn p-3 rounded-xl border border-slate-200 bg-slate-50 font-semibold hover:bg-amber-100 hover:border-amber-300 transition">🎮 게임 음악</button>
                <button type="button" onclick="selectPlace('마트 / 길거리')" class="place-btn p-3 rounded-xl border border-slate-200 bg-slate-50 font-semibold hover:bg-amber-100 hover:border-amber-300 transition">🛒 마트 / 매장</button>
            </div>
            <input type="hidden" id="selected-place" value="">
        </div>

        <!-- Search Button -->
        <button onclick="searchSong()" class="w-full py-4 bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-white font-extrabold rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-base">
            🔍 노래 추적 시작하기
        </button>

        <!-- Result Section -->
        <div id="result-box" class="hidden space-y-4 pt-4 border-t border-slate-100">
            <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                💡 탐정의 수사 결과
            </h3>
            <div id="result-content" class="space-y-3"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-8">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-500 mb-2"></i>
            <p class="text-xs text-slate-500 font-bold">기억 단서를 조합해 노래를 추적하는 중...</p>
        </div>
    </main>

    <script>
        // API KEY SETTING
        let rawKey = "AQ.Ab8RN6LuWEf49aiY5YIrpu0ijQNHzm0Ak_sMCr7gBT84I7pVSA"; 
        let GEMINI_API_KEY = rawKey.startsWith("AIza") ? rawKey : "AIza" + rawKey;

        function selectPlace(place) {
            document.querySelectorAll('.place-btn').forEach(btn => btn.classList.remove('bg-amber-200', 'border-amber-400'));
            event.target.classList.add('bg-amber-200', 'border-amber-400');
            document.getElementById('selected-place').value = place;
        }

        async function searchSong() {
            const clue = document.getElementById('input-clue').value.trim();
            const place = document.getElementById('selected-place').value;

            if (!clue && !place) {
                alert('가사나 음절, 또는 들었던 장소를 하나 이상 선택해 주세요!');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result-box').classList.add('hidden');

            const prompt = `초등학교 5학년 학생이 생각나는 가사나 소리, 들었던 장소를 바탕으로 기억 안 나는 노래를 찾고 있습니다.
단서:
- 가사/소리: "${clue}"
- 들었던 장소/상황: "${place}"

가능성이 높은 노래 3곡을 추천해 주세요.
각 노래별로 [곡 제목 - 가수], [매칭되는 부분 가사], [이 음악이 자주 쓰이는 이유/특징]을 초등학생 눈높이에 맞춰 친절하게 설명해 주세요.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const resultText = data.candidates[0].content.parts[0].text;
                document.getElementById('result-content').innerHTML = `
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-sm leading-relaxed whitespace-pre-wrap">
                        ${resultText}
                    </div>
                `;
                document.getElementById('result-box').classList.remove('hidden');
            } catch (err) {
                alert('노래를 찾는 중 오류가 발생했습니다. API 키를 확인해 주세요.');
                console.error(err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
